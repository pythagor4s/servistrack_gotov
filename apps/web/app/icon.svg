<svg xmlns="http://www.w3.org/2000/svg" viewBox="366.48 290.95 291.74 291.74" width="512" height="512">
  <!-- OPOMBA STOJI ZNOTRAJ <svg> IN NE NAD NJIM. Next velikost prebere z `image-size`, ta pa SVG
       prepozna z regexom cez PRVIH 1000 BAJTOV, in v to okno mora pasti CEL odpirajoci tag. Ko je
       opomba stala nad njim, se je tag koncal na bajtu 1037 in build je padel z "unsupported file
       type: undefined". Izmerjeno: konec taga na 997 se prebere, na 1007 ne.

       TO JE IKONA ZAVIHKA in od 2026-08-30 nima crne plosce pod sabo. Prej je znamenje merilo
       288 od 512, torej 56 % - ostalo je bila plosca, ki je v zavihku pojedla prostor. Zdaj je
       ozadje PROZORNO in znamenje zavzame 85 % visine.

       ZAKAJ 22 ENOT ZRAKA IN NE MANJ. Prvi poskus je imel 6 enot, torej 2.3 % okvirja - pri
       16 px je to 0.37 px, kar se zaokrozi v nic. Ravni zgornji rob znamenja je s tem sedel na
       PRVO vrstico pikslov: izmerjeno v ikoni 16x16 je vrstica 0 nosila 11 pikslov pri alfi 153,
       enako pa vrstica 15 - poltransparenten pas cez skoraj vso sirino, ki v zavihku bere kot
       crta nad znakom. Pri 22 enotah je zraka 7.5 % okvirja, torej 1.2 px pri 16 px, in rob
       ima svojo prazno vrstico.

       BARVA SE OBRACA S TEMO BRSKALNIKA, ker prozorna ikona nima svoje podlage: na svetli traki
       zavihkov bi bela izginila in na temni crna. Poti zato nimajo svojega `fill` in ga
       podedujejo; vrednosti v maski (#fff/#000) so prosojnost in ne barva, zato ostaneta dobesedni.

       KAJ TA DATOTEKA NE HRANI: PNG-ji za domaci zaslon. `app/apple-icon.png` in
       `public/icon-192|512.png` NAMENOMA obdrzijo temno plosco in znamenje pri 56 % - iOS
       prozornost izrise kot crno, Android pa maskable ikono OBREZE in ji rabi varno obmocje.

       `favicon.ico` (16/32/48) JE zrisan iz te risbe in je prav tako prozoren; ker ICO ne pozna
       medijskih poizvedb, nosi fiksno temno crnilo - tisto, kar velja na svetli traki. -->
  <style>
    svg { fill: #0a0a0a }
    @media (prefers-color-scheme: dark) { svg { fill: #fafafa } }
  </style>
